name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (z.B. v1.6.0)'
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run build

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Mac
        run: npm run build:mac

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            ## IMPERA Silence Remover ${{ github.ref_name }}

            ### Download
            | Datei | Platform |
            |---|---|
            | `*-Setup-*.exe` | Windows — Installer (empfohlen) |
            | `*-Portable-*.exe` | Windows — Portable, kein Install nötig |
            | `*-x64.dmg` | macOS — Intel (x64) |
            | `*-arm64.dmg` | macOS — Apple Silicon (M1/M2/M3) |

            > **Windows:** Defender zeigt ggf. Warnung → "Trotzdem ausführen"
            > **Mac:** Rechtsklick → Öffnen beim ersten Start (Gatekeeper)
